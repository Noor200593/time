<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Neon Digital Clock</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial Black', sans-serif;
        }

        .clock-container {
            position: relative;
            text-align: center;
        }

        #clock {
            font-size: 80px;
            color: #00ffff; /* Cyan Neon */
            /* 3D Effect using multiple shadows */
            text-shadow: 
                3px 3px 0px #ff00ff,   /* Pink Shadow */
                6px 6px 15px rgba(0, 255, 255, 0.5), /* Cyan Glow */
                10px 10px 20px rgba(255, 0, 255, 0.3); /* Pink Glow */
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div id="clock">00:00:00</div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();

            // Add leading zeros
            h = (h < 10) ? "0" + h : h;
            m = (m < 10) ? "0" + m : m;
            s = (s < 10) ? "0" + s : s;

            const timeString = h + ":" + m + ":" + s;
            document.getElementById("clock").innerText = timeString;
        }

        // Update every 1 second
        setInterval(updateTime, 1000);
        
        // Run immediately on load
        updateTime();
    </script>

</body>
</html>
